<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div)
    div.className = "main"
    // div.id = "myId"
    div.id = Math.round(Math.random() * 10 + 1) 
    div.setAttribute("title", "generated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // still not visible on the webpage it is in memory 
    // not attached with the page 
    // div.innerText = "Pratik Singh"
    // these methods take the reference and then override the new value 
    // set directly goes to reference and change the value 
    const addText = document.createTextNode("Pratik Singh")
    div.appendChild(addText)
    document.body.appendChild(div)
    
</script>
</html>
