<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("Python")
    addLanguage("Typescript")
    // this function every time traverse the whole tree 
    // which will require a lot of time sometimes there arises optimization issue 

    function addOptiLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('golang')
    // innerHTML is not recommended appendchild should used 

    // edit 
    const secondLang = document.querySelector("li:nth-child(2)")
    //second.innerHTML = "Mojo"
    const newli = document.createElement('li')
    newli.textContent = "Mojo" // not addded yet 
    secondLang.replaceWith(newli)

    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>Typescript</li>'

    // remove 
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()




















































</script>
</html>
